apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-canary
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/befe2005/transitstream-lab.git
    targetRevision: main
    path: gitops/apps/nginx-canary

  destination:
    server: https://kubernetes.default.svc
    namespace: transitstream

  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
