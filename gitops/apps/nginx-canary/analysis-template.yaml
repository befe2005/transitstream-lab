
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: nginx-canary-health
  namespace: transitstream
spec:
  args:
    - name: canary-hash

  metrics:
    - name: nginx-availability
      interval: 15s
      count: 3
      failureLimit: 0
      successCondition: >-
        len(result) > 0 && result[0] == 1
      failureCondition: >-
        len(result) == 0 || result[0] != 1

      provider:
        prometheus:
          address: http://prometheus-server.monitoring.svc.cluster.local
          query: |
            nginx_up{
              namespace="transitstream",
              app="nginx-canary",
              rollouts_pod_template_hash="{{args.canary-hash}}"
            }
