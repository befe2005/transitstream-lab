
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: nginx-canary
  namespace: transitstream
spec:
  replicas: 3
  revisionHistoryLimit: 3

  selector:
    matchLabels:
      app: nginx-canary

  template:
    metadata:
      labels:
        app: nginx-canary
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9113"
        prometheus.io/path: "/metrics"
        lab.transitstream.io/analysis-test: "1" 

    spec:
      terminationGracePeriodSeconds: 30

      containers:
        - name: nginx
          image: nginx:1.28-alpine
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true

          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi

        - name: nginx-exporter
          image: nginx/nginx-prometheus-exporter:1.4.2
          imagePullPolicy: IfNotPresent

          args:
            - --nginx.scrape-uri=http://127.0.0.1/stub_status

          ports:
            - name: metrics
              containerPort: 9113
              protocol: TCP

          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi

      volumes:
        - name: nginx-config
          configMap:
            name: nginx-canary-config

  strategy:
    canary:
      maxSurge: 1
      maxUnavailable: 0

      steps:
        - setWeight: 33

        - analysis:
            templates:
              - templateName: nginx-canary-health
            args:
              - name: canary-hash
                valueFrom:
                  podTemplateHashValue: Latest

        - pause: {}

        - setWeight: 67
        - pause: {}

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-canary-service
  namespace: transitstream
spec:
  type: ClusterIP

  selector:
    app: nginx-canary

  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
