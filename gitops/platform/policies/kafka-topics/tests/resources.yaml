apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: bus-gps-position
  namespace: transitstream
  labels:
    strimzi.io/cluster: transitstream
    team: fleet-tracking
    owner: someone
