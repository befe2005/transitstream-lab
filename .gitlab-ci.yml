
stages:
  - validate
  - test
  - build
  - update-gitops

# --------------------------------------------------
# 1. Validate Python source code
# --------------------------------------------------
python-syntax:
  stage: validate
  image: python:3.12-slim
  script:
    - python -m compileall -q apps/producer apps/consumer

# --------------------------------------------------
# 2. Verify Python dependencies
# --------------------------------------------------
python-imports:
  stage: test
  image: python:3.12-slim
  script:
    - python -m pip install --no-cache-dir kafka-python==2.2.15 prometheus-client==0.22.1
    - python -c "import kafka, prometheus_client; print('Dependencies imported successfully')"

# --------------------------------------------------
# 3. Reusable rootless BuildKit image build
# --------------------------------------------------
.build-image:
  stage: build
  image:
    name: moby/buildkit:rootless
    entrypoint: [""]
  variables:
    BUILDKITD_FLAGS: "--oci-worker-no-process-sandbox"
  before_script:
    - mkdir -p ~/.docker
    - |
      printf '{"auths":{"%s":{"username":"%s","password":"%s"}}}' \
        "$CI_REGISTRY" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" \
        > ~/.docker/config.json
  script:
    - |
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context="$BUILD_CONTEXT" \
        --local dockerfile="$BUILD_CONTEXT" \
        --output "type=image,name=$CI_REGISTRY_IMAGE/$IMAGE_NAME:$CI_COMMIT_SHORT_SHA,push=true"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'

build-producer:
  extends: .build-image
  variables:
    BUILD_CONTEXT: apps/producer
    IMAGE_NAME: producer

build-consumer:
  extends: .build-image
  variables:
    BUILD_CONTEXT: apps/consumer
    IMAGE_NAME: consumer

# --------------------------------------------------
# 4. Update GitOps manifests after successful builds
# --------------------------------------------------
update-gitops:
  stage: update-gitops
  image: alpine:3.20

  needs:
    - job: build-producer
    - job: build-consumer

  before_script:
    - apk add --no-cache git python3
    - git config user.name "TransitStream CI Bot"
    - git config user.email "transitstream-ci@example.invalid"

  script:
    - |
      set -eu

      python3 - <<'PY'
      import os
      import re
      from pathlib import Path

      path = Path("gitops/apps/transitstream/deployments.yaml")
      content = path.read_text()

      registry = os.environ["CI_REGISTRY_IMAGE"]
      tag = os.environ["CI_COMMIT_SHORT_SHA"]

      for name in ("producer", "consumer"):
          pattern = rf"({re.escape(registry)}/{name}:)[^\s]+"
          content, count = re.subn(
              pattern,
              lambda match: match.group(1) + tag,
              content,
          )

          if count != 1:
              raise SystemExit(
                  f"Expected exactly one image reference for {name}, found {count}"
              )

      path.write_text(content)
      print(f"Updated producer and consumer image tags to {tag}")
      PY

      git add gitops/apps/transitstream/deployments.yaml

      if git diff --cached --quiet; then
        echo "No GitOps changes required"
        exit 0
      fi

      git commit -m "ci: deploy images ${CI_COMMIT_SHORT_SHA} [skip ci]"

      test -n "${GITOPS_PUSH_TOKEN:-}" || {
        echo "ERROR: GITOPS_PUSH_TOKEN is unavailable"
        exit 1
      }

      AUTH_HEADER="$(printf 'oauth2:%s' "$GITOPS_PUSH_TOKEN" | base64 | tr -d '\n')"

      git -c "http.extraHeader=Authorization: Basic ${AUTH_HEADER}" \
        push "https://${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" \
        HEAD:main

  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
