apiVersion: apps/v1
kind: Deployment
metadata:
  name: bus-producer
  namespace: transitstream
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bus-producer
  template:
    metadata:
      labels:
        app: bus-producer
    spec:
      containers:
        - name: producer
          image: transitstream-producer:1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: KAFKA_TOPIC
              value: "bus.telemetry.raw"
            - name: PUBLISH_INTERVAL
              value: "2"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bus-consumer
  namespace: transitstream
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bus-consumer
  template:
    metadata:
      labels:
        app: bus-consumer
    spec:
      containers:
        - name: consumer
          image: transitstream-consumer:1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: KAFKA_TOPIC
              value: "bus.telemetry.raw"
            - name: KAFKA_GROUP_ID
              value: "transitstream-processors"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
