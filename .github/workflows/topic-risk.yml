name: Topic risk

# Runs on every pull request (required check) and again whenever a review is
# submitted or dismissed, so a platform approval turns the check green without
# a new push.
on:
  pull_request:
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: topic-risk-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  topic-risk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --no-cache-dir pyyaml==6.0.2

      # Base branch topics go in a separate worktree. CODEOWNERS is read from the
      # base branch so a PR cannot add itself as a platform engineer.
      - name: Check out base branch
        run: git worktree add base "${{ github.event.pull_request.base.sha }}"

      - name: Classify risk and check approvals
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          CODEOWNERS: base/.github/CODEOWNERS
        run: python base/scripts/topic_risk.py base/gitops/apps/kafka-topics gitops/apps/kafka-topics
